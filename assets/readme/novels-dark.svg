<text x="480.0" y="426.0" font-size="20" fill="#f0f6fc" font-weight="650" text-anchor="middle">85.9%</text>
<text x="480.0" y="446.0" font-size="13" fill="#9198a1" text-anchor="middle">0.66¢ per chapter</text>
<text x="355.0" y="426.0" font-size="13" fill="#9198a1" text-anchor="middle">+20.0 points</text>
<text x="730.0" y="426.0" font-size="20" fill="#f0f6fc" font-weight="650" text-anchor="middle">87.2%</text>
<text x="730.0" y="446.0" font-size="13" fill="#9198a1" text-anchor="middle">1.68¢ per chapter</text>
<text x="605.0" y="426.0" font-size="13" fill="#9198a1" text-anchor="middle">+1.3 points, within noise</text>
<text x="0.0" y="482.0" font-size="13.5" fill="#9198a1">A fourth setup that reviewed every passage, as demo.py does now, reached 87.1% at 1.52¢ per chapter.</text>
<text x="0.0" y="501.0" font-size="13.5" fill="#9198a1">Consistency: the share of a term&#x27;s appearances that use its most common English translation.</text>
