<svg xmlns="http://www.w3.org/2000/svg" width="968" height="568" viewBox="0 0 968 568" role="img" aria-labelledby="title desc">
<title id="title">Consistency per novel for each setup</title>
<desc id="desc">Each chapter alone, then memory and glossary, then review and repair. novel A: 67.3%, 83.6%, 82.5%; novel B: 63.2%, 89.3%, 90.6%; novel C: 68.4%, 87.3%, 88.6%; novel D: 64.6%, 83.1%, 86.8%; all four together: 65.9%, 85.9%, 87.2%. Memory and the glossary did most of the work in every novel; review and repair added 1.3 points, within noise.</desc>
