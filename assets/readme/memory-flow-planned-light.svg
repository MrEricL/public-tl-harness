<svg xmlns="http://www.w3.org/2000/svg" width="968" height="722" viewBox="0 0 968 722" role="img" aria-labelledby="title desc">
<title id="title">How a chapter moves through memory, with the planned dreaming pass</title>
<desc id="desc">Chapter n on the left, chapter n+1 on the right, and four layers and one planned pass between them, bottom to top. Run record: every call, cost and edit, replayable; Python adds to it and nothing edits it. Story memory: names and facts the model proposes from chapter n, kept only if their quote is in the Chinese; one snapshot per chapter, never rewritten; by chapter 25 it held 57,000–81,000 characters, 378–523 names and about 290 facts per novel. Translator&#x27;s glossary: the translator&#x27;s own names, listed first; they win over memory&#x27;s. Passage context, highlighted: the few lines one passage is given, with memory&#x27;s part at most 3,000 characters: 392 characters of memory per passage with names only, the default, or 2,862 when facts were included. Arrows: extract from chapter n into memory, select from memory and the glossary into the passage context, write from the context into chapter n+1, record from chapter n into the run record. Dreaming is planned but not built: an offline pass that would merge variant names and settle them, sized at about 15 of the 51 inconsistent renderings left after Stage 1.</desc>
