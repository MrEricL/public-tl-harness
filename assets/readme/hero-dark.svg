<text x="18.0" y="44.0" font-size="16" fill="#f0f6fc" font-weight="600">Long novels drift</text>
<rect x="320.0" y="0.0" width="280.0" height="336.0" fill="#151b23" rx="12"/>
<text x="338.0" y="44.0" font-size="16" fill="#f0f6fc" font-weight="600">The harness remembers</text>
