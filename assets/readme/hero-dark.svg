<text x="658.0" y="236.0" font-size="30" fill="#f0f6fc" font-weight="650">0.85¢</text>
<text x="658.0" y="258.0" font-size="13.5" fill="#9198a1">per chapter with memory</text>
<text x="658.0" y="300.0" font-size="12.5" fill="#9198a1">Same model with and without memory, no</text>
<text x="658.0" y="316.0" font-size="12.5" fill="#9198a1">glossary; each plan fixed in advance.</text>
