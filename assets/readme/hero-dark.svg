<rect x="338.0" y="168.0" width="244.0" height="28.0" fill="#0d1117" rx="6" stroke="#3d444d" stroke-width="1"/>
<text x="460.0" y="187.0" font-size="13" fill="#f0f6fc" font-weight="600" text-anchor="middle">Python checks every edit</text>
<text x="338.0" y="224.0" font-size="13" fill="#f0f6fc">Only names and facts whose quote</text>
<text x="338.0" y="243.0" font-size="13" fill="#f0f6fc">is in the Chinese source stay.</text>
<text x="338.0" y="262.0" font-size="13" fill="#f0f6fc">The model proposes edits; Python</text>
<text x="338.0" y="281.0" font-size="13" fill="#f0f6fc">decides which are kept, and</text>
<text x="338.0" y="300.0" font-size="13" fill="#f0f6fc">every call is recorded.</text>
<text x="658.0" y="100.0" font-size="30" fill="#f0f6fc" font-weight="650">59%</text>
<text x="658.0" y="122.0" font-size="13.5" fill="#9198a1">fewer inconsistent name translations</text>
<text x="658.0" y="168.0" font-size="30" fill="#f0f6fc" font-weight="650">54%</text>
