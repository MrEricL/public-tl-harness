<rect x="180.0" y="78.0" width="22.0" height="30.0" fill="#0d1117" rx="3" stroke="#3d444d" stroke-width="1"/>
<text x="218.0" y="100.0" font-size="16" fill="#6e7681" text-anchor="middle">…</text>
<rect x="234.0" y="78.0" width="22.0" height="30.0" fill="#0d1117" rx="3" stroke="#3d444d" stroke-width="1"/>
<text x="18.0" y="126.0" font-size="12.5" fill="#3987e5" font-weight="600">one call</text>
<text x="262.0" y="126.0" font-size="12.5" fill="#9198a1" text-anchor="end">hundreds of chapters</text>
<text x="18.0" y="156.0" font-size="13" fill="#f0f6fc">Novels arrive a chapter at a time</text>
<text x="18.0" y="175.0" font-size="13" fill="#f0f6fc">and run for hundreds of them,</text>
<text x="18.0" y="194.0" font-size="13" fill="#f0f6fc">so each one is translated alone</text>
<text x="18.0" y="213.0" font-size="13" fill="#f0f6fc">and names drift between them.</text>
<text x="18.0" y="236.0" font-size="12.5" fill="#9198a1">伊文, one character, over ten chapters:</text>
