<svg xmlns="http://www.w3.org/2000/svg" width="968" height="384" viewBox="0 0 968 384" role="img" aria-labelledby="title desc">
<title id="title">Problem, harness and result</title>
<desc id="desc">Problem: Novels arrive a chapter at a time and run for hundreds of them, so each one is translated alone and names drift between them. For example, 伊文 came out as Irwin, Evan, Ivan, Ewen, Evin, Erwin over ten chapters. Harness: source-checked story memory and the translator&#x27;s glossary go into every chapter, the model proposes edits and Python decides which are kept, and every call is recorded for replay. Result, on 60 unseen chapters with the same model and no glossary: memory gave 59% fewer inconsistent name translations than translating each chapter alone, 54% fewer on 60 more unseen chapters, at about 0.85 cents per chapter.</desc>
<rect width="968" height="384" rx="12" fill="#0d1117"/>
<g transform="translate(24 24)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#f0f6fc">
