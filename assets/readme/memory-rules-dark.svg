<svg xmlns="http://www.w3.org/2000/svg" width="968" height="440" viewBox="0 0 968 440" role="img" aria-labelledby="title desc">
<title id="title">Who may change memory</title>
<desc id="desc">Four steps. The extractor, a model, proposes names and facts, each with the sentence it came from. Python keeps an entry only if that quote is in the source, and what a character merely claims stays provisional. The translator&#x27;s glossary wins over memory whenever the two disagree. Each chapter&#x27;s snapshot is saved and never rewritten; the next one builds on it. Example from the demo: the sentence 她自称来自镜湖镇 (she says she is from Mirror Lake Town) gives 镜湖镇, Mirror Lake Town, a location kept as provisional because only she says so.</desc>
<rect width="968" height="440" rx="12" fill="#0d1117"/>
<g transform="translate(24 24)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#f0f6fc">
<text x="0.0" y="26.0" font-size="21" fill="#f0f6fc" font-weight="600">Who may change memory</text>
<text x="0.0" y="52.0" font-size="14.5" fill="#9198a1">The model proposes; Python checks each quote, and the translator&#x27;s glossary has the last word</text>
<rect x="0.0" y="84.0" width="216.5" height="164.0" fill="#132642" rx="10" stroke="#4a82d4" stroke-width="1.2"/>
<text x="14.0" y="114.0" font-size="13.5" fill="#f0f6fc" font-weight="600">Model proposes</text>
<text x="14.0" y="138.0" font-size="12.5" fill="#9198a1">A model reads the</text>
<text x="14.0" y="156.0" font-size="12.5" fill="#9198a1">chapter&#x27;s Chinese and</text>
<text x="14.0" y="174.0" font-size="12.5" fill="#9198a1">proposes names and facts,</text>
<text x="14.0" y="192.0" font-size="12.5" fill="#9198a1">each with the sentence it</text>
<text x="14.0" y="210.0" font-size="12.5" fill="#9198a1">came from.</text>
<rect x="234.5" y="84.0" width="216.5" height="164.0" fill="#33240e" rx="10" stroke="#c08a35" stroke-width="1.2"/>
<text x="248.5" y="114.0" font-size="13.5" fill="#f0f6fc" font-weight="600">Python checks</text>
<text x="248.5" y="138.0" font-size="12.5" fill="#9198a1">An entry stays only if its</text>
<text x="248.5" y="156.0" font-size="12.5" fill="#9198a1">quote is in the source.</text>
<text x="248.5" y="174.0" font-size="12.5" fill="#9198a1">What a character merely</text>
<text x="248.5" y="192.0" font-size="12.5" fill="#9198a1">claims stays provisional.</text>
<path d="M 219.5 166.0 L 225.5 166.0" fill="none" stroke="#9198a1" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 225.5 161.8 L 231.5 166.0 L 225.5 170.2 Z" fill="#9198a1" stroke="#9198a1" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="469.0" y="84.0" width="216.5" height="164.0" fill="#1a2028" rx="10" stroke="#4b5563" stroke-width="1.2"/>
<text x="483.0" y="114.0" font-size="13.5" fill="#f0f6fc" font-weight="600">Glossary wins</text>
<text x="483.0" y="138.0" font-size="12.5" fill="#9198a1">The translator&#x27;s name</text>
<text x="483.0" y="156.0" font-size="12.5" fill="#9198a1">beats memory&#x27;s whenever</text>
<text x="483.0" y="174.0" font-size="12.5" fill="#9198a1">the two disagree.</text>
<path d="M 454.0 166.0 L 460.0 166.0" fill="none" stroke="#9198a1" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 460.0 161.8 L 466.0 166.0 L 460.0 170.2 Z" fill="#9198a1" stroke="#9198a1" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="703.5" y="84.0" width="216.5" height="164.0" fill="#12301f" rx="10" stroke="#3f9a6a" stroke-width="1.2"/>
<text x="717.5" y="114.0" font-size="13.5" fill="#f0f6fc" font-weight="600">Snapshot saved</text>
<text x="717.5" y="138.0" font-size="12.5" fill="#9198a1">One per chapter, chained</text>
<text x="717.5" y="156.0" font-size="12.5" fill="#9198a1">by hash. It is never</text>
<text x="717.5" y="174.0" font-size="12.5" fill="#9198a1">rewritten; the next</text>
<text x="717.5" y="192.0" font-size="12.5" fill="#9198a1">chapter builds on it.</text>
<path d="M 688.5 166.0 L 694.5 166.0" fill="none" stroke="#9198a1" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 694.5 161.8 L 700.5 166.0 L 694.5 170.2 Z" fill="#9198a1" stroke="#9198a1" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="0.0" y="282.0" width="920.0" height="92.0" fill="#151b23" rx="10"/>
<text x="18.0" y="306.0" font-size="13" fill="#9198a1">From the demo:</text>
<text x="142.0" y="306.0" font-size="13.5" fill="#f0f6fc">她自称来自镜湖镇 (she says she is from Mirror Lake Town)</text>
<text x="14.0" y="334.0" font-size="12" fill="#6e7681">proposed</text>
<text x="14.0" y="352.0" font-size="13.5" fill="#f0f6fc">镜湖镇 → Mirror Lake Town</text>
<text x="248.5" y="334.0" font-size="12" fill="#6e7681">kept, as provisional</text>
<text x="248.5" y="352.0" font-size="13.5" fill="#f0f6fc">the quote is in the source, but only she says so</text>
</g>
</svg>
