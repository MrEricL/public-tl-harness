<svg xmlns="http://www.w3.org/2000/svg" width="968" height="580" viewBox="0 0 968 580" role="img" aria-labelledby="title desc">
<title id="title">Before and after the memory delivery fix</title>
<desc id="desc">Before: of 78 appearances of a name memory had recorded, its line was in the prompt for 25 (32%). 33 came before memory had learned the name, because the extractor could record only 12 names a chapter and spent many on names it already knew; 20 were dropped by a rule that removed any memory line overlapping a glossary term, even when the two agreed. After: the extractor may record 24 names a chapter and is told which names memory holds, and a line is dropped only when it disagrees with the glossary; 572 of 662 appearances (86%) had memory&#x27;s line in every passage. On development chapters, name consistency went from 83.0% with the old memory to 87.5% with the fixed one (78.0% with no memory).</desc>
<rect width="968" height="580" rx="12" fill="#ffffff"/>
<g transform="translate(24 24)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#1f2328">
<text x="0.0" y="26.0" font-size="21" fill="#1f2328" font-weight="600">Memory&#x27;s names reached the prompt 32% of the time; after the fix, 86%</text>
<text x="0.0" y="52.0" font-size="14.5" fill="#59636e">Ten lines stand for the names memory had recorded, drawn to the measured shares</text>
