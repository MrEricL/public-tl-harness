<svg xmlns="http://www.w3.org/2000/svg" width="968" height="504" viewBox="0 0 968 504" role="img" aria-labelledby="title desc">
<title id="title">Distinct translations per term accumulate without the harness</title>
<desc id="desc">Average number of different English translations per tracked term so far, by chapter. Without the harness it reaches 2.49 by chapter 10; the three harness setups reach 1.52–1.56. Descriptive counts from automated extraction.</desc>
