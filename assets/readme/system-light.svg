<path d="M 214.0 137.8 L 220.0 142.0 L 214.0 146.2 Z" fill="#59636e" stroke="#59636e" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="256.0" y="528.0" font-size="13" fill="#8c959f">The next chapter starts from the updated memory</text>
<circle cx="232" cy="142" r="12" fill="#ffffff" stroke="#59636e" stroke-width="1.4"/>
<text x="232.0" y="146.5" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">1</text>
<text x="256.0" y="140.0" font-size="15" fill="#1f2328" font-weight="600">Story memory</text>
<text x="256.0" y="160.0" font-size="13" fill="#59636e">Notes names and facts; Python checks every quote</text>
<rect x="585.9" y="128.0" width="114.1" height="24.0" fill="#ffffff" rx="12" stroke="#d1d9e0" stroke-width="1"/>
<text x="643.0" y="144.0" font-size="12" fill="#59636e" font-weight="600" text-anchor="middle">Model + Python</text>
<circle cx="232" cy="199" r="12" fill="#ffffff" stroke="#59636e" stroke-width="1.4"/>
<text x="232.0" y="203.5" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">2</text>
<text x="256.0" y="197.0" font-size="15" fill="#1f2328" font-weight="600">Context builder</text>
<text x="256.0" y="217.0" font-size="13" fill="#59636e">Glossary first, then the most relevant memory</text>
<rect x="639.7" y="185.0" width="60.3" height="24.0" fill="#ffffff" rx="12" stroke="#d1d9e0" stroke-width="1"/>
<text x="669.8" y="201.0" font-size="12" fill="#59636e" font-weight="600" text-anchor="middle">Python</text>
<circle cx="232" cy="256" r="12" fill="#ffffff" stroke="#59636e" stroke-width="1.4"/>
<text x="232.0" y="260.5" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">3</text>
<text x="256.0" y="254.0" font-size="15" fill="#1f2328" font-weight="600">Writer</text>
<text x="256.0" y="274.0" font-size="13" fill="#59636e">Drafts the English chapter with that context</text>
<rect x="646.4" y="242.0" width="53.6" height="24.0" fill="#ffffff" rx="12" stroke="#d1d9e0" stroke-width="1"/>
<text x="673.2" y="258.0" font-size="12" fill="#59636e" font-weight="600" text-anchor="middle">Model</text>
<circle cx="232" cy="313" r="12" fill="#ffffff" stroke="#59636e" stroke-width="1.4"/>
<text x="232.0" y="317.5" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">4</text>
<text x="256.0" y="311.0" font-size="15" fill="#1f2328" font-weight="600">Term alignment</text>
<text x="256.0" y="331.0" font-size="13" fill="#59636e">Fixes glossary terms the draft missed</text>
<rect x="646.4" y="299.0" width="53.6" height="24.0" fill="#ffffff" rx="12" stroke="#d1d9e0" stroke-width="1"/>
<text x="673.2" y="315.0" font-size="12" fill="#59636e" font-weight="600" text-anchor="middle">Model</text>
<circle cx="232" cy="370" r="12" fill="#ffffff" stroke="#59636e" stroke-width="1.4"/>
<text x="232.0" y="374.5" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">5</text>
<text x="256.0" y="368.0" font-size="15" fill="#1f2328" font-weight="600">Reviewer</text>
<text x="256.0" y="388.0" font-size="13" fill="#59636e">Compares each passage with the source, suggests edits</text>
<rect x="646.4" y="356.0" width="53.6" height="24.0" fill="#ffffff" rx="12" stroke="#d1d9e0" stroke-width="1"/>
<text x="673.2" y="372.0" font-size="12" fill="#59636e" font-weight="600" text-anchor="middle">Model</text>
<circle cx="232" cy="427" r="12" fill="#ffffff" stroke="#59636e" stroke-width="1.4"/>
<text x="232.0" y="431.5" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">6</text>
<text x="256.0" y="425.0" font-size="15" fill="#1f2328" font-weight="600">Edit guards</text>
<text x="256.0" y="445.0" font-size="13" fill="#59636e">Keeps an edit only if no check gets worse</text>
<rect x="639.7" y="413.0" width="60.3" height="24.0" fill="#ffffff" rx="12" stroke="#d1d9e0" stroke-width="1"/>
<text x="669.8" y="429.0" font-size="12" fill="#59636e" font-weight="600" text-anchor="middle">Python</text>
<circle cx="232" cy="484" r="12" fill="#ffffff" stroke="#59636e" stroke-width="1.4"/>
<text x="232.0" y="488.5" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">7</text>
<text x="256.0" y="482.0" font-size="15" fill="#1f2328" font-weight="600">Recorder</text>
<text x="256.0" y="502.0" font-size="13" fill="#59636e">Saves every call, cost and edit for replay</text>
<rect x="639.7" y="470.0" width="60.3" height="24.0" fill="#ffffff" rx="12" stroke="#d1d9e0" stroke-width="1"/>
<text x="669.8" y="486.0" font-size="12" fill="#59636e" font-weight="600" text-anchor="middle">Python</text>
<rect x="0.0" y="150.0" width="172.0" height="86.0" fill="#eef1f4" rx="10" stroke="#aab4bf" stroke-width="1.2"/>
<text x="14.0" y="178.0" font-size="14.5" fill="#1f2328" font-weight="600">Chinese chapters</text>
<text x="14.0" y="200.0" font-size="13" fill="#59636e">a folder of .txt files,</text>
<text x="14.0" y="218.0" font-size="13" fill="#59636e">read in order</text>
<rect x="0.0" y="266.0" width="172.0" height="86.0" fill="#eef1f4" rx="10" stroke="#aab4bf" stroke-width="1.2"/>
<text x="14.0" y="294.0" font-size="14.5" fill="#1f2328" font-weight="600">Translator&#x27;s glossary</text>
<text x="14.0" y="316.0" font-size="13" fill="#59636e">the translator&#x27;s chosen</text>
<text x="14.0" y="334.0" font-size="13" fill="#59636e">names (optional)</text>
<rect x="0.0" y="382.0" width="172.0" height="86.0" fill="#eef1f4" rx="10" stroke="#aab4bf" stroke-width="1.2"/>
<text x="14.0" y="410.0" font-size="14.5" fill="#1f2328" font-weight="600">Chat model API</text>
<text x="14.0" y="432.0" font-size="13" fill="#59636e">any OpenAI-compatible</text>
<text x="14.0" y="450.0" font-size="13" fill="#59636e">provider, e.g. DeepSeek</text>
