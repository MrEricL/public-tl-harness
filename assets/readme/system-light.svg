<text x="756.0" y="294.0" font-size="14.5" fill="#1f2328" font-weight="600">HTML report</text>
<text x="756.0" y="316.0" font-size="13" fill="#59636e">every edit, warning</text>
<text x="756.0" y="334.0" font-size="13" fill="#59636e">and cost, side by side</text>
