<svg xmlns="http://www.w3.org/2000/svg" width="968" height="604" viewBox="0 0 968 604" role="img" aria-labelledby="title desc">
<title id="title">What goes into the harness, what it does, and what comes out</title>
<desc id="desc">Inputs: Chinese chapters, an optional translator glossary and a chat model API. Harness steps: story memory, context builder, writer, term alignment, reviewer, edit guards and recorder, with memory carried into the next chapter. Outputs: an English TXT/EPUB book, an HTML report of every edit and cost, and a replay cache.</desc>
<rect width="968" height="604" rx="12" fill="#ffffff"/>
<g transform="translate(24 24)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#1f2328">
<text x="0.0" y="26.0" font-size="21" fill="#1f2328" font-weight="600">What goes in, what the harness does, and what comes out</text>
<text x="0.0" y="52.0" font-size="14.5" fill="#59636e">The model writes and proposes; plain Python checks each proposal, decides what is kept and records it</text>
<text x="0.0" y="90.0" font-size="13.5" fill="#59636e" font-weight="600">Inputs</text>
<text x="196.0" y="90.0" font-size="13.5" fill="#59636e" font-weight="600">The harness</text>
<text x="742.0" y="90.0" font-size="13.5" fill="#59636e" font-weight="600">Outputs</text>
<rect x="196.0" y="104.0" width="518.0" height="450.0" fill="#f6f8fa" rx="12"/>
