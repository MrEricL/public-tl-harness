<svg xmlns="http://www.w3.org/2000/svg" width="968" height="244" viewBox="0 0 968 244" role="img" aria-labelledby="title desc">
<title id="title">Other results from the experiments</title>
<desc id="desc">10 of 10 planted meaning errors fixed in a live run (2 of 2 clean passages left unchanged); 16 to 8 judgments favoring the repaired draft (one judge model; 16 ties in 40 chapters); 0.80 AUROC for spotting flawed passages (Jev) (0.74 on web novels; about $0.0002 a call); 86% of glossary terms used exactly (up from 37%; the baseline had no glossary); $2.41 API cost of the whole web-novel study (development included; judges on subscriptions).</desc>
<rect width="968" height="244" rx="12" fill="#0d1117"/>
<g transform="translate(24 24)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#f0f6fc">
