<text x="600.4" y="76.0" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="end">Codex · GPT-5.6 Terra · 36</text>
<text x="0.0" y="398.0" font-size="13.5" fill="#59636e">Rules-only control (no model): 15 of 36. The first harness also held 17 real problems for review, but a hold is not a repair.</text>
<text x="0.0" y="417.0" font-size="13.5" fill="#59636e">Its verifier accepted an edit only if a rule score improved. After that changed, a separate check repaired</text>
<text x="0.0" y="436.0" font-size="13.5" fill="#59636e">10 of 10 targeted meaning errors. Scored by blinded agent-assisted review, not human raters.</text>
