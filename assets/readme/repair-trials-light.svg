<circle cx="785.2" cy="255.4" r="7" fill="#e34948" stroke="#ffffff" stroke-width="2"/>
<text x="773.2" y="279.4" font-size="13.5" fill="#1f2328" font-weight="600" text-anchor="end">First harness · 11</text>
