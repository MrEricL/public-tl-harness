<svg xmlns="http://www.w3.org/2000/svg" width="968" height="518" viewBox="0 0 968 518" role="img" aria-labelledby="title desc">
<title id="title">Live repair trials: faithful repairs against tokens used</title>
<desc id="desc">252 live repair trials, 36 per setup. The first harness delivered 11 faithful repairs using 1,498,379 tokens; a direct DeepSeek prompt delivered 36 using 16,684. Other setups: Single-agent harness 15 using 488,190, Claude Code · Sonnet 5 30 using 78,226, Codex · GPT-5.6 Luna 34 using 383,084, Codex · GPT-5.6 Terra 36 using 454,303.</desc>
<rect width="968" height="518" rx="12" fill="#ffffff"/>
<g transform="translate(24 24)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#1f2328">
<text x="0.0" y="26.0" font-size="21" fill="#1f2328" font-weight="600">The first harness used 90× the tokens of a direct prompt and repaired a third as many</text>
<text x="0.0" y="52.0" font-size="14.5" fill="#59636e">Faithful repairs out of 36 against tokens used, per setup · 252 live trials, September 2026 · log scale</text>
