[project]
name = "agentic-translation-harness"
version = "0.2.0"
description = "A bounded agentic repair harness for reliable long-form translation pipelines"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "MrEricL" },
]
requires-python = ">=3.11"
dependencies = [
  "ebooklib",
  "jinja2",
  "openai>=1",
  "pydantic>=2",
  "pyyaml",
  "rich",
  "typer",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
agentic-translation = "agentic_translation.cli:app"

[project.urls]
Repository = "https://github.com/MrEricL/public-tl-harness"
Issues = "https://github.com/MrEricL/public-tl-harness/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentic_translation*"]

[tool.setuptools.package-data]
agentic_translation = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
