<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Translation workbench</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1.5' y='1.5' width='13' height='13' fill='none' stroke='%232e6b4f' stroke-width='1.5'/%3E%3Cpath d='M8 2v12M2 8h12' stroke='%232e6b4f' stroke-dasharray='1.4 1.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/workbench.css">
</head>
<body>
<a class="skip" href="#view">Skip to the run</a>
<div class="app">
  <aside class="rail">
    <header class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="2" width="28" height="28"/>
        <path d="M16 3v26M3 16h26"/>
      </svg>
      <div>
        <h1>Translation workbench</h1>
        <p id="root-path" class="muted">Reading runs…</p>
      </div>
      <button id="rail-toggle" class="rail-toggle" type="button" aria-expanded="false" aria-controls="run-list">Runs</button>
    </header>
    <nav id="run-list" aria-label="Recorded runs"></nav>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<script src="/workbench.js" defer></script>
</body>
</html>
