name: Harness v3

on:
  push:
    paths:
      - ".github/workflows/harness-v3.yml"
      - "agentic_translation/**"
      - "experiments/mid_corpus_harness_benchmark/**"
      - "samples/**"
      - "tests/**"
      - "tools/**"
      - "docs/**"
      - "assets/**"
      - "pyproject.toml"
      - "LICENSE"
      - "DATA_NOTICE.md"
      - "CHANGELOG.md"
      - "README.md"
      - "USER_GUIDE.md"
      - "DEMO_SCRIPT.md"
  pull_request:
    paths:
      - ".github/workflows/harness-v3.yml"
      - "agentic_translation/**"
      - "experiments/mid_corpus_harness_benchmark/**"
      - "samples/**"
      - "tests/**"
      - "tools/**"
      - "docs/**"
      - "assets/**"
      - "pyproject.toml"
      - "LICENSE"
      - "DATA_NOTICE.md"
      - "CHANGELOG.md"
      - "README.md"
      - "USER_GUIDE.md"
      - "DEMO_SCRIPT.md"

permissions:
  contents: read

jobs:
  harness-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run the complete portable test suite
        run: python -m pytest -q

      - name: Run the focused experiment benchmark tests
        working-directory: experiments/mid_corpus_harness_benchmark
        run: python -m pytest -q test_benchmark.py

      - name: Smoke golden auto-approve (synthetic, no provider)
        run: python -m agentic_translation harness golden --runs-dir "${{ runner.temp }}/harness-v3-runs" --auto-approve --overwrite

      - name: Smoke Harness v3 contract bench (synthetic, no provider)
        run: python -m agentic_translation harness bench --suite samples/harness_eval/v3_cases.json --out "${{ runner.temp }}/harness-v3-bench" --overwrite

      - name: Smoke automatic repair (synthetic, no provider)
        run: python -m agentic_translation harness run --story samples/synthetic_repair_demo/story.yaml --out "${{ runner.temp }}/automatic-repair" --auto-approve

      - name: Smoke automatic replay (cache only)
        run: python -m agentic_translation harness replay "${{ runner.temp }}/automatic-repair" --out "${{ runner.temp }}/automatic-repair-replay"
