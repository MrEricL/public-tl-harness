name: Translation harness

on:
  push:
    paths:
      - ".github/workflows/harness-v3.yml"
      - "agentic_translation/**"
      - "assets/**"
      - "docs/**"
      - "experiments/**"
      - "samples/**"
      - "tests/**"
      - "tools/**"
      - "*.md"
      - "demo.py"
      - "pyproject.toml"
      - "public-release-manifest.json"
      - "release/**"
  pull_request:
    paths:
      - ".github/workflows/harness-v3.yml"
      - "agentic_translation/**"
      - "assets/**"
      - "docs/**"
      - "experiments/**"
      - "samples/**"
      - "tests/**"
      - "tools/**"
      - "*.md"
      - "demo.py"
      - "pyproject.toml"
      - "public-release-manifest.json"
      - "release/**"

permissions:
  contents: read

jobs:
  harness-v3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,jev]"

      - name: Run the complete portable test suite
        run: python -m pytest -q --junitxml="${{ runner.temp }}/test-results.xml"

      - name: Check the portfolio CLI and credential-free demo
        run: |
          python demo.py --help
          python demo.py --offline --out "${{ runner.temp }}/portfolio-offline"

      - name: Run the focused experiment benchmark tests
        working-directory: "experiments/mid_corpus_harness_benchmark"
        run: python -m pytest -q test_benchmark.py

      - name: Smoke golden auto-approve (synthetic, no provider)
        run: python -m agentic_translation harness golden --runs-dir "${{ runner.temp }}/harness-v3-runs" --auto-approve --overwrite

      - name: Smoke translation showcase auto-approve (synthetic, no provider)
        run: python -m agentic_translation harness run --story samples/showcase/story.yaml --out "${{ runner.temp }}/translation-showcase" --auto-approve

      - name: Smoke translation showcase replay (synthetic, no provider)
        run: python -m agentic_translation harness replay "${{ runner.temp }}/translation-showcase" --out "${{ runner.temp }}/translation-showcase-replay"

      - name: Smoke translation showcase comparison (synthetic, one trial)
        run: python -m agentic_translation harness compare --out "${{ runner.temp }}/translation-showcase-comparison" --provider-mode offline --trials 1

      - name: Smoke Harness v3 contract bench (synthetic, no provider)
        run: python -m agentic_translation harness bench --suite samples/harness_eval/v3_cases.json --out "${{ runner.temp }}/harness-v3-bench" --overwrite

      - name: Retain test and source-free evidence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-evidence-python-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/test-results.xml
          retention-days: 14
          if-no-files-found: warn
